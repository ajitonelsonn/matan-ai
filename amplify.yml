version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@10.6.4 --activate
        - pnpm install
    build:
      commands:
        # Amplify exposes console variables (and Secrets) to the BUILD only. The Next.js SSR
        # compute runtime does not receive them, so write the server-side ones into
        # .env.production, which Next bundles into the server build. Only allow-listed
        # names are copied; AWS credentials are never part of this (the compute role is used).
        - env | grep -E '^(S3_MEDIA_BUCKET|DYNAMODB_TABLE_NAME|SES_FROM_EMAIL|SES_CONFIGURATION_SET|APP_BASE_URL|EMAIL_PROVIDER|SMTP_HOST|SMTP_PORT|SMTP_USER|SMTP_FROM|SMTP_PASSWORD|BEDROCK_MODEL_ID|MATAN_AI_MONTHLY_TOKEN_BUDGET|RING_SESSION_SECRET)=' >> .env.production || true
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
